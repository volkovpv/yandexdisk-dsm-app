name: Build SPK

# Принудительный гейт детерминизма (Г-2 W6): на каждый push ЛЮБОЙ ветки и PR
# прогоняются герметичные поведенческие тесты, полный build.sh (все статические
# гейты обязательны — без skip) и самопроверка воспроизводимости (две сборки
# должны дать одинаковый SHA256). На версионный тег (v*) публикуется
# версионированный .spk + .sha256 как GitHub Release asset.
# Actions запинены по commit-SHA, а не по тегу: тег изменяем, SHA — нет (Г-1 §11.7).

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release / upload assets on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ubuntu-latest ships bash, tar, gzip, unzip, curl, dash, python3 and
      # shellcheck; checkbashisms (devscripts) ставится отдельно — build.sh
      # требует его обязательно (гейт без инструмента не имеет права на skip).
      - name: Install checkbashisms (required gate tool)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends devscripts

      - name: Hermetic behavioural tests (fake-rclone, no NAS)
        run: bash test/run-hermetic.sh

      - name: Build .spk + static checks
        run: bash build.sh

      - name: Reproducibility self-check (rebuild twice, compare SHA256)
        run: bash test/check-reproducible.sh

      - name: Upload .spk as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: YandexDisk-ARM-spk
          path: |
            YandexDisk-ARM-*.spk
            YandexDisk-ARM-*.spk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            YandexDisk-ARM-*.spk YandexDisk-ARM-*.spk.sha256 \
            --title "Yandex Disk (ARM) ${GITHUB_REF_NAME}" \
            --notes "Автосборка ${GITHUB_REF_NAME}. Изменения — в CHANGELOG-ARM.md. Проверка: sha256sum -c YandexDisk-ARM-*.spk.sha256" \
            --verify-tag
